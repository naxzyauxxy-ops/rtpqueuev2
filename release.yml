name: Release

# Tag a commit with v1.2.1 (etc) and this publishes the jar to GitHub Releases.
# MADE BY AUXXY

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package --file pom.xml

      - name: Read project version
        id: version
        run: echo "value=$(mvn -q -B help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      # Catches the easy mistake of tagging v1.3.0 without bumping the pom.
      - name: Check the tag matches the pom version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          POM="${{ steps.version.outputs.value }}"
          if [ "$TAG" != "$POM" ]; then
            echo "::error::Tag v$TAG does not match pom.xml version $POM. Bump the pom or retag."
            exit 1
          fi
          echo "Tag and pom agree on $POM."

      # Copies whatever jar Maven produced, without depending on finalName.
      # The original-* exclusion is future-proofing in case maven-shade is
      # added later; it produces no such file today.
      - name: Stage the release jar
        run: |
          mkdir -p release
          find target -maxdepth 1 -name '*.jar' ! -name 'original-*' -exec cp {} release/ \;
          ls -la release/
          test -n "$(ls -A release/)" || { echo "::error::No jar was produced."; exit 1; }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: RTPQueue ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          body: |
            **RTPQueue ${{ github.ref_name }}** - MADE BY AUXXY

            Drop `RTPQueue-${{ steps.version.outputs.value }}.jar` into your server's `plugins/` folder and restart.

            Requires Paper 1.21+ on Java 21.

            If you are using the licensing system, set `license.key`, `license.api-url`
            and `license.public-key` in `config.yml` before starting.
          files: release/*.jar
